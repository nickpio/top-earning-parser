name: Daily RTE100 Pipeline

on:
  schedule:
    # Run daily at 6:00 AM UTC. Keep this fixed: concurrent-player snapshots are
    # time-of-day dependent, so a consistent scrape hour keeps the index comparable.
    - cron: '0 6 * * *'

  # Allow manual triggering
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          npm ci
          pip install -r requirements.txt

      - name: Run pipeline (scrape -> prune -> index engine)
        run: npm run pipeline

      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index_data/ data/
          git diff --staged --quiet || git commit -m "Data for $(date +%Y-%m-%d)"
          git push

      - name: Deploy to Vercel (optional)
        if: success() && env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -X POST "$VERCEL_DEPLOY_HOOK"
        continue-on-error: true
